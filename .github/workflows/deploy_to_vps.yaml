name: Deploy to VPS

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/dfg/projects/markov-chains
            git pull origin deploy
            docker build -t markov_chain_streamlit .
            docker stop markov_chain_app || true
            docker rm markov_chain_app || true
            docker run -d -p 127.0.0.1:8501:8501 --name markov_chain_app --restart unless-stopped markov_chain_streamlit